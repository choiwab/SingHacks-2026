[project]
name = "client-future-room"
version = "0.2.0"
description = "A grounded wealth-intelligence demo for the SingHacks Julius Baer challenge"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "google-auth-oauthlib>=1.2,<2",
    "httpx>=0.28.0,<1.0",
    "langgraph>=1.2.11,<2.0",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    "mcp>=1.26,<2",
    "msal>=1.31,<2",
    "pandas>=3.0.0,<4.0",
    "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0",
    "ruff>=0.12.0,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
