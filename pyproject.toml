[project]
name = "client-future-room"
version = "0.1.0"
description = "A grounded wealth-intelligence demo for the SingHacks Julius Baer challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "pandas>=2.3.0,<3.0",
    "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0",
    "pytest>=8.4.0,<9.0",
    "ruff>=0.12.0,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
