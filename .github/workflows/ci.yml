name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Test Python
        run: uv run pytest

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Type-check Python and frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      - name: Verify generated contract
        run: pnpm check:contract

      - name: Build frontend
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end test
        id: e2e
        run: pnpm test:e2e

      - name: Test live API browser workflow
        id: live_e2e
        run: pnpm test:e2e:live

      - name: Preserve browser test diagnostics
        if: ${{ !cancelled() && (steps.e2e.outcome != 'skipped' || steps.live_e2e.outcome != 'skipped') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error
